<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See Drama - نبض الدراما</title>
    <style>
        body { background-color: #0b0b0b; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: #1a1a1a; border-radius: 10px; overflow: hidden; transition: 0.3s; border: 1px solid #333; }
        .card:hover { transform: scale(1.05); border-color: #e50914; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card h3 { font-size: 14px; padding: 10px; margin: 0; text-align: center; height: 40px; overflow: hidden; }
        .badge { background: #e50914; color: white; padding: 2px 8px; font-size: 10px; border-radius: 3px; margin: 5px; display: inline-block; }
    </style>
</head>
<body>
    <h2 style="color: #e50914;">🎬 آخر الإضافات الكورية</h2>
    <div id="movie-list" class="grid">
        <!-- البيانات ستظهر هنا -->
    </div>

    <script>
        fetch('movies.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('movie-list');
                data.forEach(movie => {
                    container.innerHTML += `
                        <div class="card" onclick="window.location.href='${movie.url}'">
                            <img src="${movie.poster}" alt="${movie.title}">
                            <span class="badge">${movie.quality}</span>
                            <h3>${movie.title}</h3>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
